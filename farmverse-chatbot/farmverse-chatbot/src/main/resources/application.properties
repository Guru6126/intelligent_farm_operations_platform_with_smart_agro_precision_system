spring.application.name=farmverse-chatbot
# Server port for the standalone chatbot module. It will be overridden when the module is started as part of the combined backend.
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:3306/farmverse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

agro.datasource.url=jdbc:mysql://localhost:3306/agroprecision?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
agro.datasource.username=root
agro.datasource.password=root 

ollama.base-url=http://localhost:11434
ollama.chat-model=qwen2.5:1.5b
ollama.embed-model=nomic-embed-text
ollama.multilingual-model=gemma3:4b
ollama.timeout-seconds=120

farmverse.match-threshold=0.65
farmverse.translated-match-threshold=0.72
farmverse.rag-min-score=0.45

farmverse.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
